<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Leesvriend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Varela+Round&family=Tajawal:wght@400;700&display=swap">
<style>
/* Layout: one narrow reading column; the story text is the hero, set large in a typeface made for early readers. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#17213B; --muted:#5B6782; --line:#D5DEEA; --soft:#FFF4C2;
  --mark:#FFD84D; --mark-ink:#17213B; --ok:#0F7F66; --almost:#A65F00; --bad:#C0283F; --help:#B8336E;
  --accent:#2F5BD3; --accent-ink:#FFFFFF;
  --f-read:"Andika", "Comic Sans MS", system-ui, sans-serif;
  --f-ui:"Varela Round", "Tajawal", "Arial Rounded MT Bold", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --surface:#182038; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2A3555; --soft:#3A3418;
  --mark:#F2C531; --mark-ink:#17213B; --ok:#4FD1A9; --almost:#F0B060; --bad:#FF7A8C; --help:#F27DB1;
  --accent:#7EA0FF; --accent-ink:#10162A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#182038; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2A3555; --soft:#3A3418;
  --mark:#F2C531; --mark-ink:#17213B; --ok:#4FD1A9; --almost:#F0B060; --bad:#FF7A8C; --help:#F27DB1;
  --accent:#7EA0FF; --accent-ink:#10162A; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-read);font-weight:700;font-size:28px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-ui);font-weight:400;font-size:14px;color:var(--muted)}
h2{font-size:20px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
button,input{font-family:var(--f-ui);font-size:16px}
button{cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mode{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.langs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.langs span{font-size:13px;color:var(--muted);margin-inline-end:4px}
.langs button{min-height:36px;padding:6px 14px;border-radius:999px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.story-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;padding:14px 16px;width:100%}
.story-btn .t{font-family:var(--f-read);font-size:20px;font-weight:700}
.level{font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.stars{color:var(--mark);font-size:18px;letter-spacing:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
details.panel{gap:0}
details.panel[open]{gap:14px}
summary{cursor:pointer;font-weight:bold}
.text{font-family:var(--f-read);font-size:clamp(24px,6vw,32px);line-height:1.9;word-spacing:.12em;text-align:left}
.w{border-radius:8px;padding:0 4px;margin:0 -1px;cursor:pointer;transition:background .15s,color .15s}
.w.sent{background:var(--soft)}
.w.cur{background:var(--mark);color:var(--mark-ink)}
.w.ok{color:var(--ok)}
.w.almost{color:var(--almost)}
.w.bad{color:var(--bad);font-weight:700}
.w.missed{text-decoration:underline wavy var(--bad);text-underline-offset:6px}
.w.helped{color:var(--help)}
.w.cur.stuck{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--mark)}}
.listening{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-inline-end:8px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.w.cur.stuck,.listening{animation:none}}
.status{font-size:15px;min-height:1.5em}
.mic{--lvl:0;display:inline-flex;align-items:center;gap:10px;padding:12px 22px 12px 18px;border-radius:999px;font-size:17px;font-weight:bold;
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transition:box-shadow .08s linear,background .2s}
.mic svg{width:24px;height:24px;flex:none}
.mic[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff;
  box-shadow:0 0 0 calc(3px + var(--lvl) * 16px) color-mix(in srgb, var(--bad) 28%, transparent)}
section{display:flex;flex-direction:column;gap:16px}
.starrow{display:flex;gap:6px;justify-content:center}
.starrow svg{width:60px;height:60px;display:block}
.starrow .on path{fill:var(--mark);stroke:var(--mark-ink)}
.starrow .off path{fill:none;stroke:var(--line)}
.points{display:flex;align-items:baseline;gap:8px;justify-content:center;font-variant-numeric:tabular-nums}
.points b{font-family:var(--f-read);font-size:64px;line-height:1}
.points>span{color:var(--muted);font-size:18px}
#recText{font-family:var(--f-read);font-size:20px;line-height:1.8;text-align:left}
.rs{border-radius:8px;padding:0 3px;cursor:pointer}
.rs.cur{background:var(--mark);color:var(--mark-ink)}
.rs.done:not(.cur){color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.home-text{font-size:18px;line-height:1.8}
.opts{display:grid;gap:8px}
.opts button{text-align:start}
.opts button.right{border-color:var(--ok);color:var(--ok);font-weight:bold}
.opts button.wrong{border-color:var(--bad);color:var(--bad)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vocab button{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vocab .nl{font-family:var(--f-read);font-size:20px;font-weight:700}
.done{text-align:center;align-items:center}
.bigstar{width:110px;height:110px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-read);font-size:18px;padding:6px 12px;min-height:auto}
.note{font-size:13px;color:var(--muted)}
.ltr{direction:ltr;text-align:left}
</style>

<div class="wrap">
  <header>
    <div class="brand">Leesvriend<small data-t="sub"></small></div>
    <span class="mode" id="modeTag"></span>
  </header>

  <!-- HOME -->
  <section id="home" class="wrap" style="gap:16px">
    <div class="langs" id="langs"><span data-t="homeLang"></span>
      <button data-lang="he" lang="he">עברית</button><button data-lang="en" lang="en">English</button><button data-lang="ar" lang="ar">العربية</button>
    </div>
    <h2 data-t="pick"></h2>
    <div class="list" id="storyList"></div>
    <p class="note" id="modeNote"></p>
    <details class="panel" id="settings">
      <summary data-t="azTitle"></summary>
      <p class="note" data-t="azNote"></p>
      <label for="azKey"><span data-t="azKey"></span><input id="azKey" type="password" autocomplete="off" class="ltr" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx"></label>
      <label for="azRegion"><span data-t="azRegion"></span><input id="azRegion" type="text" class="ltr" placeholder="westeurope"></label>
      <div class="row"><button class="primary" id="azSave" data-t="save"></button><button class="ghost" id="azClear" data-t="clearKey"></button></div>
      <p class="status" id="azStatus"></p>
    </details>
    <div class="row"><button id="toReport" class="ghost" data-t="report"></button></div>
  </section>

  <!-- READ -->
  <section id="read" hidden>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2 id="readTitle" dir="ltr" lang="nl"></h2>
        <span class="level" id="readLevel"></span>
      </div>
      <div class="text" id="storyText" dir="ltr" lang="nl"></div>
      <p class="status" id="readStatus"></p>
      <p class="note" id="heard" dir="ltr" lang="nl" hidden></p>
      <p class="note" id="diag" dir="ltr" style="font-family:ui-monospace,monospace;font-size:12px"></p>
      <div class="row" id="micControls">
        <button class="mic" id="micBtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="micLabel"></span></button>
        <button id="againBtn" data-t="again" hidden></button>
        <button class="ghost" id="nextBtn" data-t="next" hidden></button>
      </div>
      <div class="row" id="parentControls" hidden>
        <button class="primary" id="okBtn" data-t="ok"></button>
        <button id="helpBtn" data-t="hearWord"></button>
        <button class="ghost" id="skipBtn" data-t="skip"></button>
      </div>
      <div class="legend" id="legend"></div>
      <p class="note" data-t="tapHint"></p>
    </div>
    <div class="row"><button class="ghost" id="backBtn" data-t="back"></button></div>
  </section>

  <!-- HOME-LANGUAGE PART -->
  <section id="homepart" hidden>
    <div class="panel">
      <h2 data-t="nowIn"></h2>
      <p class="home-text" id="homeText"></p>
      <div class="row"><button id="homeListen" data-t="listen"></button></div>
    </div>
    <div class="panel">
      <h2 id="qText"></h2>
      <div class="opts" id="qOpts"></div>
    </div>
    <div class="panel">
      <h2 data-t="newWords"></h2>
      <div class="vocab" id="vocab"></div>
    </div>
    <div class="row"><button class="primary" id="finishBtn" data-t="finish" disabled></button></div>
  </section>

  <!-- DONE -->
  <section id="done" hidden>
    <div class="panel done">
      <div class="starrow" id="starRow"></div>
      <h2 id="doneTitle"></h2>
      <div class="points"><b id="pointsNum">0</b><span>/ 100 <span data-t="points"></span></span></div>
      <p class="muted" id="pointsDetail"></p>
    </div>
    <div class="panel">
      <h2 data-t="recTitle"></h2>
      <p class="note" data-t="recNote"></p>
      <p class="level" id="recPos"></p>
      <div id="recText" dir="ltr" lang="nl"></div>
      <div class="row"><button class="mic" id="recBtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="recLabel"></span></button></div>
      <div class="row">
        <button id="modelBtn" data-t="recModel"></button>
        <button id="playBtn" data-t="recPlay" disabled></button>
        <button class="primary" id="bothBtn" data-t="recBoth" disabled></button>
      </div>
      <div class="row">
        <button class="ghost" id="prevBtn" data-t="recPrev"></button>
        <button class="ghost" id="nextSentBtn" data-t="recNext"></button>
      </div>
      <p class="status" id="recStatus"></p>
      <p class="note" data-t="recPrivacy"></p>
    </div>
    <div class="row" style="justify-content:center"><button class="primary" id="homeBtn" data-t="nextStory"></button></div>
  </section>

  <!-- REPORT -->
  <section id="report" hidden>
    <div class="panel">
      <h2 data-t="report"></h2>
      <div class="stats" id="stats"></div>
      <div>
        <p style="margin-bottom:8px"><b data-t="practice"></b> <span class="muted" data-t="tapHear"></span></p>
        <div class="chips" id="practice" dir="ltr"></div>
      </div>
      <div class="list" id="history"></div>
      <p class="note" data-t="deviceNote"></p>
    </div>
    <div class="row"><button class="ghost" id="reportBack" data-t="back2"></button><button class="ghost" id="resetBtn"></button></div>
    <p class="note" id="resetConfirm" hidden></p>
  </section>
</div>

/* ---------- speech out ---------- */
function voiceFor(prefix){ try{ return speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(prefix)); }catch(e){ return null; } }
function say(text, code, onend){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code; u.rate = code.startsWith("nl") ? 0.8 : 0.95;
    const v = voiceFor(code.slice(0,2)); if (v) u.voice = v;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ if (onend) onend(); }
}
try{ speechSynthesis.onvoiceschanged = () => {}; }catch(e){}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize("NFC").replace(/[^a-zà-ÿ]/g,"");
const bare = s => s.replace(/[^\p{L}]/gu,"");
function lev(a,b){
  const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
// speech recognition often writes short Dutch words and names a little differently; accept the common near-misses
const ALIAS = { de:["die","the","te","du","da"], mo:["moe","mou","mow","mos","moo","mooi","moet","more"], sam:["sem","zam","sum","some"],
  een:["en","eén","één"], het:["hat","ed"], is:["es","ies"], hij:["hei","hey","hi","high"], ze:["zij","zie","se","zei"],
  opa:["oppa","opah","oma"], daan:["dan","daam","don"], noor:["nor","nur","noord","nora"], kat:["cat","kad","kaat"], vis:["fis","fish"] };
function close(heard, want){
  if (!heard || !want) return false;
  if (heard === want || (ALIAS[want] && ALIAS[want].includes(heard))) return true;
  const d = lev(heard, want);
  if (want.length <= 4) return heard[0] === want[0] && d <= 1;
  if (want.length <= 7) return d <= 1 || (heard.startsWith(want.slice(0,4)) && d <= 2);
  return d <= 2;
}

function loadSdk(){
  if (window.SpeechSDK) return Promise.resolve();
  if (sdkLoading) return sdkLoading;
  sdkLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js";
    s.onload = () => window.SpeechSDK ? res() : rej(); s.onerror = () => { sdkLoading = null; rej(); };
    document.head.appendChild(s);
  });
  return sdkLoading;
}
function legendItem(color, text, wavy){

  if (wavy){ b.style.textDecoration = "underline wavy var(--bad)"; b.style.textUnderlineOffset = "4px"; } else b.style.color = color;
  s.appendChild(b); s.appendChild(document.createTextNode(text)); return s;

/* Azure: one sentence at a time, scored per word, then on to the next sentence by itself */
function azureListen(){

  $("againBtn").hidden = true; $("nextBtn").hidden = true;
  const ref = sentences[sIdx];
  for (let i = 0; i < words.length; i++) if (words[i].s === sIdx){ states[i] = ""; scores[i] = null; }

    const S = window.SpeechSDK;

    cfg.speechRecognitionLanguage = "nl-NL";
    const audio = S.AudioConfig.fromDefaultMicrophoneInput();
    const pa = new S.PronunciationAssessmentConfig(ref, S.PronunciationAssessmentGradingSystem.HundredMark, S.PronunciationAssessmentGranularity.Phoneme, true);
    reco = new S.SpeechRecognizer(cfg, audio);

// Map Azure's per-word results onto the words of the current sentence and decide what happens next

  let g = 0;
  mine.forEach(i => {
    let hit = null;
    for (let k = g; k < Math.min(g + 3, got.length); k++){ if (close(norm(got[k].Word), words[i].n)){ hit = k; break; } }
    if (hit === null && got[g] && mine.length === got.length) hit = g;

  const tiles = [[S.length,t.tiles[0]],[mins,t.tiles[1]]];
  if (avg !== null) tiles.push([avg, t.tiles[2]]);
  tiles.push([total ? Math.round(ok/total*100) + "%" : "0%", t.tiles[3]], [quiz + "/" + S.length, t.tiles[4]]);
  $("stats").textContent = "";
  tiles.forEach(([b,x]) => { const d = document.createElement("div"); d.className = "stat"; d.innerHTML = "<b></b><span></span>"; d.children[0].textContent = b; d.children[1].textContent = x; $("stats").appendChild(d); });
  const p = $("practice"); p.textContent = "";
  const top = Object.entries(data.practice).sort((a,b) => b[1] - a[1]).slice(0,8);
  if (!top.length){ const s = document.createElement("span"); s.className = "muted"; s.dir = t.dir; s.textContent = t.none; p.appendChild(s); }
  top.forEach(([w]) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = w; b.onclick = () => say(w, "nl-NL"); p.appendChild(b); });
  const h = $("history"); h.textContent = "";
  S.slice(-5).reverse().forEach(s => {
    const st = STORIES.find(x => x.id === s.story), d = document.createElement("p"); d.className = "muted";
    const date = new Date(s.date).toLocaleDateString(t.locale, { day:"numeric", month:"short" });
    d.textContent = `${date} · ${st ? st.title : s.story} · ${s.ok}/${s.total} ${t.hWords}` + (s.score != null ? ` · ${t.hPron} ${s.score}` : "") + (s.points != null ? ` · ★ ${s.points}` : "") + ` · ${Math.max(1, Math.round(s.secs/60))} ${t.hMin}`;
    h.appendChild(d);
  });
  $("resetConfirm").hidden = true; resetArmed = false; $("resetBtn").textContent = t.reset;
  show("report");
}
$("resetBtn").onclick = () => {
  if (!resetArmed){ resetArmed = true; $("resetBtn").textContent = L().resetAgain; return; }
  data = { sessions:[], practice:{} }; save(data); renderReport();
  $("resetConfirm").hidden = false; $("resetConfirm").textContent = L().resetDone;
};
$("toReport").onclick = renderReport;
$("reportBack").onclick = renderHome;

applyLang();
renderHome();
</script>
