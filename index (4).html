<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Leesvriend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow storybook column. Story pages are white "paper" on a soft sky; every button is chunky and pressable like a toy key.
   Colours come from a Dutch street: bicycle orange (actions), canal teal (correct), sunflower yellow (the word to read), tulip red (try again). */
:root{
  --bg:#EAF0FF; --surface:#FFFFFF; --ink:#1E2A5A; --muted:#5E6893; --line:#D8E0F6; --soft:#FFF3C4;
  --orange:#FF7A1A; --teal:#0E9485; --teal-soft:#D6F3EE; --sun:#FFD23F; --sun-ink:#1E2A5A;
  --rose:#D93A44; --rose-soft:#FDE3E4; --amber:#A65F00; --amber-soft:#FFEFD3;
  --ok:var(--teal); --almost:var(--amber); --bad:var(--rose); --help:#B8336E; --mark:var(--sun); --mark-ink:var(--sun-ink); --accent:var(--orange);
  --f-read:"Andika","Comic Sans MS",system-ui,sans-serif;
  --f-ui:"Fredoka","Baloo Bhaijaan 2","Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12173A; --surface:#1C2350; --ink:#EEF1FF; --muted:#A3ACD6; --line:#2E3878; --soft:#3A3420;
  --orange:#FF8A3D; --teal:#3FD8C6; --teal-soft:#123F45; --rose:#FF6B70; --rose-soft:#4A1F33; --amber:#FFB547; --amber-soft:#43341A; --help:#F27DB1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12173A; --surface:#1C2350; --ink:#EEF1FF; --muted:#A3ACD6; --line:#2E3878; --soft:#3A3420;
  --orange:#FF8A3D; --teal:#3FD8C6; --teal-soft:#123F45; --rose:#FF6B70; --rose-soft:#4A1F33; --amber:#FFB547; --amber-soft:#43341A; --help:#F27DB1; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
section{display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:28px;line-height:1.2}
h2{font-size:20px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.center{text-align:center;justify-content:center}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* buttons: chunky keys with a solid under-edge */
button,input{font-family:var(--f-ui);font-size:17px}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:48px;padding:10px 18px;
  border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.soft{background:var(--bg)}
.iconbtn{background:none;border:0;box-shadow:none;min-height:40px;padding:6px 2px;color:var(--muted)}
.iconbtn:active:not(:disabled){box-shadow:none}
.big{min-height:58px;font-size:19px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.logo .ic{width:26px;height:26px}
.brand b{display:block;font-family:var(--f-read);font-size:26px;line-height:1.1}
.brand small{display:block;font-size:13px;color:var(--muted)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}

/* home */
.langs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langs>span{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.seg button{min-height:38px;padding:4px 16px;border:0;border-radius:999px;box-shadow:none;background:none;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.story-btn{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;border-radius:22px;text-align:start;gap:0;min-height:0}
.cover{display:block;width:100%;height:auto}
.sb{display:flex;flex-direction:column;gap:6px;padding:12px 16px 14px}
.story-btn .t{font-family:var(--f-read);font-size:22px;font-weight:700;line-height:1.2}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.level{font-size:13px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px;white-space:nowrap}
.stars{font-size:20px;letter-spacing:2px;color:var(--line)}
.stars .on{color:var(--sun)}
details.panel{gap:0}
details.panel[open]{gap:14px}
summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--muted);list-style:none}
summary::-webkit-details-marker{display:none}

/* panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line)}
.ph{display:flex;align-items:center;gap:10px}
.ph .badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--orange)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* reading page */
.page{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line)}
.page h2{font-family:var(--f-read);font-size:22px;font-weight:700}
.prog{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;direction:ltr}
.prog span{display:block;height:100%;width:0;background:var(--teal);border-radius:inherit;transition:width .3s ease}
.text{font-family:var(--f-read);font-size:clamp(26px,7vw,34px);line-height:1.85;word-spacing:.12em;text-align:left}
.w{border-radius:10px;padding:0 5px;margin:0 -2px;cursor:pointer;transition:background .15s,color .15s}
.w.sent{background:var(--soft)}
.w.cur{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.w.ok{color:var(--teal)}
.w.almost{color:var(--amber)}
.w.bad{color:var(--rose);font-weight:700}
.w.missed{text-decoration:underline wavy var(--rose);text-underline-offset:7px}
.w.helped{color:var(--help)}
.w.cur.stuck{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--sun)}}
.status{font-size:16px;min-height:1.5em;text-align:center}
.heard{font-size:15px;color:var(--muted);text-align:center;font-family:var(--f-read)}
.listening{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rose);margin-inline-end:8px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);justify-content:center}

/* the big round microphone */
.orbrow{display:flex;flex-direction:column;align-items:center;gap:12px}
.orb{--lvl:0;flex-direction:column;gap:8px;background:none;border:0;box-shadow:none;padding:4px;min-height:0;color:var(--ink);font-size:16px}
.orb:active:not(:disabled){transform:none;box-shadow:none}
.orb-c{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;
  box-shadow:0 5px 0 color-mix(in srgb,var(--orange) 55%,#000),0 0 0 calc(var(--lvl) * 18px) color-mix(in srgb,var(--orange) 25%,transparent);
  transition:box-shadow .08s linear,background .2s,transform .08s}
.orb-c .ic{width:38px;height:38px}
.orb:active:not(:disabled) .orb-c{transform:translateY(3px)}
.orb[aria-pressed="true"] .orb-c{background:var(--rose);
  box-shadow:0 5px 0 color-mix(in srgb,var(--rose) 55%,#000),0 0 0 calc(6px + var(--lvl) * 18px) color-mix(in srgb,var(--rose) 25%,transparent)}
@media (prefers-reduced-motion:reduce){.w.cur.stuck,.listening{animation:none}.orb-c,.prog span{transition:none}}

/* home-language part */
.home-text{font-size:19px;line-height:1.8}
.opts{display:grid;gap:10px}
.opts button{justify-content:flex-start;text-align:start;min-height:56px;font-size:18px}
.opts button.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);box-shadow:0 4px 0 var(--teal)}
.opts button.wrong{border-color:var(--rose);background:var(--rose-soft);color:var(--rose);box-shadow:0 4px 0 var(--rose)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vocab button{justify-content:space-between;min-height:56px}
.vocab .nl{font-family:var(--f-read);font-size:21px;font-weight:700}
.vocab .tr{color:var(--muted);font-weight:500}
.vocab .ic{color:var(--orange)}

/* end screen */
.score{align-items:center;text-align:center;gap:8px}
.starrow{display:flex;gap:8px;justify-content:center}
.starrow svg{width:62px;height:62px;display:block}
.starrow .on path{fill:var(--sun);stroke:color-mix(in srgb,var(--sun) 55%,#000)}
.starrow .off path{fill:var(--bg);stroke:var(--line)}
.points{display:flex;align-items:baseline;gap:8px;justify-content:center;font-variant-numeric:tabular-nums}
.points b{font-family:var(--f-read);font-size:72px;line-height:1}
.points>span{color:var(--muted);font-size:18px}
#recText{font-family:var(--f-read);font-size:21px;line-height:1.9;text-align:left}
.rs{border-radius:10px;padding:2px 4px;cursor:pointer}
.rs.cur{background:var(--soft)}
.rs.good:not(.cur){color:var(--teal)}
.cw.ok{color:var(--teal);font-weight:700}
.cw.bad{color:var(--rose);font-weight:700;text-decoration:underline wavy var(--rose);text-underline-offset:5px}
.verdict{font-size:18px;font-weight:600;padding:12px 16px;border-radius:16px;text-align:center}
.verdict.good{color:var(--teal);background:var(--teal-soft)}
.verdict.almost{color:var(--amber);background:var(--amber-soft)}
.verdict.bad,.verdict.none{color:var(--rose);background:var(--rose-soft)}
.sep{border:0;border-top:2px dashed var(--line);margin:4px 0;width:100%}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rose);flex:none}
#recBtn[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--rose) 55%,#000)}
#recBtn[aria-pressed="true"] .dot{background:#fff}

/* report */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-read);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-read);font-size:18px;min-height:40px;padding:4px 14px}
.list{display:flex;flex-direction:column;gap:6px}
.danger{color:var(--rose)}
.ltr{direction:ltr;text-align:left}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-11M3 20h18"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4M4.5 4v4.5H9"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5.5l9 6.5-9 6.5zM18 5.5v13"/></symbol>

  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></symbol>

</svg>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg></span><div><b>Leesvriend</b><small data-t="sub"></small></div></div>
    <span class="mode" id="modeTag"></span>
  </header>

  <!-- HOME -->
  <section id="home">
    <h1 data-t="pick"></h1>
    <div class="langs" id="langs"><span data-t="homeLang"></span>
      <div class="seg"><button data-lang="he" lang="he">עברית</button><button data-lang="en" lang="en">English</button><button data-lang="ar" lang="ar">العربية</button></div>
    </div>
    <div class="covers" id="storyList"></div>
    <p class="note" id="modeNote"></p>
    <div class="row"><button class="soft" id="toReport"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span data-t="report"></span></button></div>
    <details class="panel" id="settings">
      <summary><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span data-t="azTitle"></span></summary>
      <p class="note" data-t="azNote"></p>
      <label for="azKey"><span data-t="azKey"></span><input id="azKey" type="password" autocomplete="off" class="ltr" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx"></label>
      <label for="azRegion"><span data-t="azRegion"></span><input id="azRegion" type="text" class="ltr" placeholder="westeurope"></label>
      <div class="row"><button class="primary" id="azSave"><span data-t="save"></span></button><button class="soft" id="azClear"><span data-t="clearKey"></span></button></div>
      <p class="status" id="azStatus"></p>
    </details>
  </section>

  <!-- READ -->
  <section id="read" hidden>
    <div class="bar"><button class="iconbtn" id="backBtn"><svg class="ic flip" aria-hidden="true"><use href="#i-back"/></svg><span data-t="back"></span></button><span class="level" id="readLevel"></span></div>
    <div class="page">
      <h2 id="readTitle" dir="ltr" lang="nl"></h2>
      <div class="prog"><span id="progFill"></span></div>
      <div class="text" id="storyText" dir="ltr" lang="nl"></div>
    </div>
    <p class="status" id="readStatus"></p>
    <p class="heard" id="heard" dir="ltr" lang="nl" hidden></p>
    <div class="orbrow" id="micControls">
      <button class="orb" id="micBtn" aria-pressed="false"><span class="orb-c"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><span id="micLabel"></span></button>
      <div class="row center"><button class="soft" id="againBtn" hidden><svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg><span data-t="again"></span></button><button class="primary" id="nextBtn" hidden><span data-t="next"></span><svg class="ic flip" aria-hidden="true"><use href="#i-next"/></svg></button></div>
    </div>
    <div class="row center" id="parentControls" hidden>
      <button class="primary" id="okBtn"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-t="ok"></span></button>
      <button class="soft" id="helpBtn"><svg class="ic" aria-hidden="true"><use href="#i-vol"/></svg><span data-t="hearWord"></span></button>
      <button class="iconbtn" id="skipBtn"><svg class="ic flip" aria-hidden="true"><use href="#i-skip"/></svg><span data-t="skip"></span></button>
    </div>
    <div class="legend" id="legend"></div>
    <p class="note center" data-t="tapHint"></p>
  </section>

  <!-- HOME-LANGUAGE PART -->
  <section id="homepart" hidden>
    <div class="panel">
      <div class="ph"><span class="badge"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></span><h2 data-t="nowIn"></h2></div>
      <p class="home-text" id="homeText"></p>
      <div class="row"><button class="soft" id="homeListen"><svg class="ic" aria-hidden="true"><use href="#i-vol"/></svg><span data-t="listen"></span></button></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="badge"><svg class="ic" aria-hidden="true"><use href="#i-ask"/></svg></span><h2 id="qText"></h2></div>
      <div class="opts" id="qOpts"></div>
    </div>
    <div class="panel">
      <div class="ph"><span class="badge"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg></span><h2 data-t="newWords"></h2></div>
      <div class="vocab" id="vocab"></div>
    </div>
    <button class="primary big" id="finishBtn" disabled><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span data-t="finish"></span></button>
  </section>

  <!-- END: points + practice -->
  <section id="done" hidden>
    <div class="panel score">
      <div class="starrow" id="starRow"></div>
      <h2 id="doneTitle"></h2>
      <div class="points"><b id="pointsNum">0</b><span>/ 100 <span data-t="points"></span></span></div>
      <p class="muted" id="pointsDetail"></p>
    </div>
    <div class="panel">
      <div class="ph"><span class="badge"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><h2 data-t="recTitle"></h2></div>
      <p class="note" data-t="recNote"></p>
      <span class="level" id="recPos" style="align-self:flex-start"></span>
      <div id="recText" dir="ltr" lang="nl"></div>
      <div class="orbrow"><button class="orb" id="chkBtn" aria-pressed="false"><span class="orb-c"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><span id="chkLabel"></span></button></div>
      <p class="verdict" id="chkVerdict" hidden></p>
      <div class="row center">
        <button class="iconbtn" id="prevBtn"><svg class="ic flip" aria-hidden="true"><use href="#i-prev"/></svg><span data-t="recPrev"></span></button>
        <button class="iconbtn" id="nextSentBtn"><span data-t="recNext"></span><svg class="ic flip" aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
      <hr class="sep">
      <p class="note" data-t="recCompareNote"></p>
      <div class="row"><button class="soft" id="recBtn" aria-pressed="false"><span class="dot"></span><span id="recLabel"></span></button></div>

function voiceFor(prefix){ try{ return speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(prefix)); }catch(e){ return null; } }
function say(text, code, onend){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code; u.rate = code.startsWith("nl") ? 0.8 : 0.95;
    const v = voiceFor(code.slice(0,2)); if (v) u.voice = v;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ if (onend) onend(); }
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize("NFC").replace(/[^a-zà-ÿ]/g,"");
const bare = s => s.replace(/[^\p{L}]/gu,"");
function lev(a,b){
  const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
// speech recognition often writes short Dutch words and names a little differently; accept the common near-misses
const ALIAS = { de:["die","the","te","du","da"], mo:["moe","mou","mow","mos","moo","mooi","moet","more"], sam:["sem","zam","sum","some"],
  een:["en","eén","één"], het:["hat","ed"], is:["es","ies"], hij:["hei","hey","hi","high"], ze:["zij","zie","se","zei"],
  opa:["oppa","opah","oma"], daan:["dan","daam","don"], noor:["nor","nur","noord","nora"], kat:["cat","kad","kaat"], vis:["fis","fish"] };
function close(heard, want){
  if (!heard || !want) return false;
  if (heard === want || (ALIAS[want] && ALIAS[want].includes(heard))) return true;
  const d = lev(heard, want);
  if (want.length <= 4) return heard[0] === want[0] && d <= 1;
  if (want.length <= 7) return d <= 1 || (heard.startsWith(want.slice(0,4)) && d <= 2);
  return d <= 2;
}

/* ---------- reading ---------- */
let story, words, sentences, idx, sIdx, states, scores, t0, helped, tries, stuckTimer, busy=false, active=false;
function startStory(s){
  story = s; idx = 0; sIdx = 0; tries = 0; helped = new Set(); t0 = Date.now(); active = false;
  $("readTitle").textContent = s.title; $("readLevel").textContent = s.level;
  const box = $("storyText"); box.textContent = "";
  sentences = s.text.match(/[^.!?]+[.!?]+/g).map(x => x.trim());
  words = [];
  sentences.forEach((sent, si) => sent.split(/\s+/).forEach(raw => {
    const i = words.length, el = document.createElement("span");
    el.className = "w"; el.textContent = raw;
    el.onclick = () => { say(bare(raw), "nl-NL"); helped.add(norm(raw)); if (engine === "parent" && i === idx){ states[i] = "helped"; paint(); } };
    box.appendChild(el); box.appendChild(document.createTextNode(" "));
    words.push({ raw, n: norm(raw), s: si, el });
  }));
  states = words.map(() => ""); scores = words.map(() => null);
  setMic(false); $("micBtn").hidden = false; $("heard").hidden = true; renderDiag();
  $("againBtn").hidden = true; $("nextBtn").hidden = true;
  status(L().st[engine]);
  paint(); show("read");
}
function paint(){
  words.forEach((w,i) => {
    let c = "w";
    if (states[i]) c += " " + states[i];
    if (engine === "azure"){ if (w.s === sIdx && !states[i]) c += " sent"; }
    else if (i === idx) c += " cur";
    w.el.className = c;
  });
  const cur = engine === "azure" ? words.find(w => w.s === sIdx) : words[idx];
  if (cur && cur.el.scrollIntoView) cur.el.scrollIntoView({ block:"nearest", behavior:"smooth" });
  const pf = $("progFill"); if (pf) pf.style.width = (words.length ? Math.round(states.filter(Boolean).length / words.length * 100) : 0) + "%";
}

/* Azure: one sentence at a time, scored per word, then on to the next sentence by itself */
function azureListen(){
  if (busy) return;
  if (!window.SpeechSDK){ status(L().loading); loadSdk().catch(() => {}); return; }
  busy = true; active = true; setMic(true);
  $("againBtn").hidden = true; $("nextBtn").hidden = true;
  const ref = sentences[sIdx];
  for (let i = 0; i < words.length; i++) if (words[i].s === sIdx){ states[i] = ""; scores[i] = null; }
  paint();
  status(L().listenSent, true);
  let reco;
  try{
    const S = window.SpeechSDK;
    const cfg = S.SpeechConfig.fromSubscription(az.key, az.region);
    cfg.speechRecognitionLanguage = "nl-NL";
    const audio = S.AudioConfig.fromDefaultMicrophoneInput();
    const pa = new S.PronunciationAssessmentConfig(ref, S.PronunciationAssessmentGradingSystem.HundredMark, S.PronunciationAssessmentGranularity.Phoneme, true);
    reco = new S.SpeechRecognizer(cfg, audio);
    pa.applyTo(reco);
    reco.recognizeOnceAsync(res => { try{ reco.close(); }catch(e){} busy = false; if (active) handleAzure(res); },
      err => { try{ reco.close(); }catch(e){} busy = false; azureError(String(err)); });
  }catch(e){ busy = false; azureError(String(e)); }
}
function azureError(msg){
  setMic(false);
  if (/401|1006|auth/i.test(msg)) status(L().keyBad);
  else if (/microphone|permission|NotAllowed/i.test(msg)) status(L().noMic);
  else status(L().netErr);
}
function handleAzure(res){
  const S = window.SpeechSDK;
  if (res.reason !== S.ResultReason.RecognizedSpeech){
    setMic(false);
    if (res.reason === S.ResultReason.Canceled){ azureError(res.errorDetails || ""); return; }
    status(L().notHeard); return;
  }
  const pr = S.PronunciationAssessmentResult.fromResult(res);
  scoreSentence(((pr.detailResult && pr.detailResult.Words) || []));
}
// Map Azure's per-word results onto the words of the current sentence and decide what happens next
function scoreSentence(azWords){
  const got = azWords.filter(w => w.PronunciationAssessment?.ErrorType !== "Insertion");
  const mine = words.map((w,i) => i).filter(i => words[i].s === sIdx);
  let g = 0;
  mine.forEach(i => {
    let hit = null;
    for (let k = g; k < Math.min(g + 3, got.length); k++){ if (close(norm(got[k].Word), words[i].n)){ hit = k; break; } }
    if (hit === null && got[g] && mine.length === got.length) hit = g;
    if (hit === null){ states[i] = "missed"; scores[i] = 0; return; }
    const a = got[hit].PronunciationAssessment || {}; g = hit + 1;
    if (a.ErrorType === "Omission"){ states[i] = "missed"; scores[i] = 0; return; }
    const sc = Math.round(a.AccuracyScore ?? 0); scores[i] = sc;
    states[i] = sc >= 80 ? "ok" : sc >= 60 ? "almost" : "bad";
  });
  paint();
  const weak = mine.filter(i => states[i] === "bad" || states[i] === "missed");
  if (weak.length && tries < 1){
    tries++; setMic(false); status(L().almost);
    $("againBtn").hidden = false; $("nextBtn").hidden = false;
    return;
  }
  status(weak.length ? L().moveOn : L().great);
  setTimeout(nextSentence, 1100);
}
function nextSentence(){
  if (!active) return;
  tries = 0; sIdx++;
  if (sIdx >= sentences.length){ finishReading(); return; }
  paint(); azureListen();
}
$("againBtn").onclick = azureListen;
$("nextBtn").onclick = () => { $("againBtn").hidden = true; $("nextBtn").hidden = true; nextSentence(); };

/* Chrome: continuous listening, word heard or not */
let rec, listening = false, baseIdx = 0;

    const st = STORIES.find(x => x.id === s.story), d = document.createElement("p"); d.className = "muted";
    const date = new Date(s.date).toLocaleDateString(t.locale, { day:"numeric", month:"short" });
    d.textContent = `${date} · ${st ? st.title : s.story} · ${s.ok}/${s.total} ${t.hWords}` + (s.score != null ? ` · ${t.hPron} ${s.score}` : "") + (s.points != null ? ` · ★ ${s.points}` : "") + ` · ${Math.max(1, Math.round(s.secs/60))} ${t.hMin}`;
    h.appendChild(d);
  });
  $("resetConfirm").hidden = true; resetArmed = false; $("resetBtn").textContent = t.reset;
  show("report");
}
$("resetBtn").onclick = () => {
  if (!resetArmed){ resetArmed = true; $("resetBtn").textContent = L().resetAgain; return; }
  data = { sessions:[], practice:{} }; save(data); renderReport();
  $("resetConfirm").hidden = false; $("resetConfirm").textContent = L().resetDone;
};
$("toReport").onclick = renderReport;
$("reportBack").onclick = renderHome;

applyLang();
renderHome();
</script>
